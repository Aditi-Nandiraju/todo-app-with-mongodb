<!DOCTYPE html>
<html>
<head>
    <title>Flask & MongoDB Todo App</title>
</head>
<body>
    <h2>Simple Todo App (Flask + MongoDB)</h2>

    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Enter a new task..." required>
        <button type="submit">Add Task</button>
    </form>

    <ul>
        {% for todo in todos %}
        <li>{{ todo.task }}</li>
        {% endfor %}
    </ul>
</body>
</html>
